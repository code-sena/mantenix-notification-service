# Local database for notification-service (ADR-004: one database per service).
# Start:  docker compose up -d
# Stop:   docker compose down
services:
  notification-db:
    image: postgres:17
    container_name: mantenix-notification-db
    environment:
      POSTGRES_DB: mantenix_notifications
      POSTGRES_USER: mantenix
      POSTGRES_PASSWORD: mantenix
    ports:
      - "5432:5432"
    volumes:
      - notification-data:/var/lib/postgresql/data

volumes:
  notification-data:
